[package]
name = "figcraft-apple-ipad-clipboard"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
[workspace]
[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSObject", "NSData", "NSUUID", "NSArray", "NSDictionary"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["std", "UIApplication", "UIResponder", "UIPasteboard"] }
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
