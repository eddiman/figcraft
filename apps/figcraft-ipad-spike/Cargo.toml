[package]
name = "figcraft-ipad-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Temporary T02 native host experiment, not the production iPad target"

[lints]
workspace = true

[dependencies]
figcraft-engine = { workspace = true }
figcraft-text = { workspace = true }
figcraft-ui-egui = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-format = { workspace = true }
figcraft-color = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
image = { workspace = true }
serde_json = { workspace = true }

env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
